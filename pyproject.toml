[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tookit"
version = "0.1.0"
description = "A clean utility class for image loading, resizing, edges, and clustering."
dependencies = [
    "numpy",
    "torch",
    "torchvision",
    "Pillow",
    "scipy",
    "scikit-learn"
]