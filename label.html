<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YOLO Labeler - Pro Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#1e1e1e] text-[#cccccc] font-sans min-h-screen flex flex-col items-center justify-center p-4 select-none">

    <!-- Photoshop-style Application Window -->
    <div class="bg-[#252526] border border-[#333333] rounded-lg shadow-2xl p-6 w-full max-w-xl flex flex-col items-center">
        
        <!-- Top Toolbar / Header -->
        <div class="w-full flex items-center justify-between pb-4 mb-4 border-b border-[#3f3f46]">
            <div class="flex items-center space-x-2">
                <span class="w-3 h-3 rounded-full bg-[#ff5f56] inline-block"></span>
                <span class="w-3 h-3 rounded-full bg-[#ffbd2e] inline-block"></span>
                <span class="w-3 h-3 rounded-full bg-[#27c93f] inline-block"></span>
                <span class="text-xs font-semibold text-[#969696] uppercase tracking-wider ml-2">YOLO Annotation Tool</span>
            </div>
            <label class="cursor-pointer bg-[#0e639c] hover:bg-[#1177bb] text-white text-xs font-medium px-3 py-1.5 rounded transition-colors shadow">
                Open Image
                <input type="file" id="upload" accept="image/*" class="hidden">
            </label>
        </div>

        <!-- Canvas Workspace -->
        <div class="relative bg-[#1e1e1e] p-2 rounded border border-[#3f3f46] shadow-inner">
            <canvas id="canvas" width="512" height="512" class="cursor-crosshair block rounded"></canvas>
        </div>

        <!-- Properties / Status Panel -->
        <div class="w-full mt-4 flex flex-col space-y-3">
            <div class="flex items-center justify-between bg-[#1e1e1e] border border-[#3f3f46] rounded px-3 py-2 text-xs font-mono text-[#4ec9b0]">
                <span id="output" class="truncate">Draw a bounding box on the image...</span>
            </div>
            
            <button id="downloadBtn" style="display:none;" class="w-full bg-[#0e639c] hover:bg-[#1177bb] text-white text-sm font-semibold py-2 rounded transition-colors shadow-md">
                Export Label (.lbl)
            </button>
        </div>
    </div>

    <script>
        const upload = document.getElementById('upload');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const output = document.getElementById('output');
        const downloadBtn = document.getElementById('downloadBtn');
        
        let img = new Image();
        let imageName = "image";
        let isDrawing = false;
        let startX, startY, endX, endY;
        let lastYoloText = "";

        // Initial blank canvas state
        ctx.fillStyle = '#1e1e1e';
        ctx.fillRect(0, 0, 512, 512);
        ctx.fillStyle = '#666666';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('No image loaded', 256, 256);

        upload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            imageName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
            const reader = new FileReader();
            reader.onload = (event) => {
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        img.onload = () => {
            ctx.clearRect(0, 0, 512, 512);
            ctx.drawImage(img, 0, 0, 512, 512);
            downloadBtn.style.display = 'none';
            output.innerText = "Image loaded. Click and drag to draw a bounding box.";
        };

        canvas.addEventListener('mousedown', (e) => {
            if (!img.src) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            startX = (e.clientX - rect.left) * scaleX;
            startY = (e.clientY - rect.top) * scaleY;
            isDrawing = true;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            endX = (e.clientX - rect.left) * scaleX;
            endY = (e.clientY - rect.top) * scaleY;
            
            ctx.clearRect(0, 0, 512, 512);
            ctx.drawImage(img, 0, 0, 512, 512);
            
            // Photoshop-style selection border (Cyan/Blue tint)
            ctx.strokeStyle = '#007acc';
            ctx.lineWidth = 2;
            ctx.strokeRect(startX, startY, endX - startX, endY - startY);
            
            ctx.fillStyle = 'rgba(0, 122, 204, 0.15)';
            ctx.fillRect(startX, startY, endX - startX, endY - startY);
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!isDrawing) return;
            isDrawing = false;
            const x1 = Math.min(startX, endX);
            const y1 = Math.min(startY, endY);
            const w = Math.abs(endX - startX);
            const h = Math.abs(endY - startY);
            
            if (w < 2 || h < 2) return; // Prevent accidental micro-clicks

            const cx = (x1 + w / 2) / 512;
            const cy = (y1 + h / 2) / 512;
            const normW = w / 512;
            const normH = h / 512;
            
            lastYoloText = `0 ${cx.toFixed(4)} ${cy.toFixed(4)} ${normW.toFixed(4)} ${normH.toFixed(4)}`;
            output.innerText = lastYoloText;
            downloadBtn.style.display = 'block';
        });

        downloadBtn.addEventListener('click', () => {
            const blob = new Blob([lastYoloText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `${imageName}.lbl`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
