<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple YOLO Labeler (512x512 Display)</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 20px; }
        canvas { border: 2px solid #333; cursor: crosshair; margin-top: 10px; display: block; margin-left: auto; margin-right: auto; width: 512px; height: 512px; }
        #output { margin-top: 15px; font-family: monospace; background: #f4f4f4; padding: 10px; display: inline-block; }
        button { margin-top: 10px; padding: 8px 15px; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>
    <input type="file" id="upload" accept="image/*"><br>
    <canvas id="canvas" width="512" height="512"></canvas>
    <div id="output">Draw a box on the image to generate coordinates.</div><br>
    <button id="downloadBtn" style="display:none;">Download Label (.txt)</button>

    <script>
        const upload = document.getElementById('upload');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const output = document.getElementById('output');
        const downloadBtn = document.getElementById('downloadBtn');

        let img = new Image();
        let imageName = "image";
        let isDrawing = false;
        let startX, startY, endX, endY;
        let lastYoloText = "";

        upload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            imageName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
            const reader = new FileReader();
            reader.onload = (event) => {
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        img.onload = () => {
            ctx.clearRect(0, 0, 512, 512);
            ctx.drawImage(img, 0, 0, 512, 512);
            downloadBtn.style.display = 'none';
        };

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            startX = (e.clientX - rect.left) * scaleX;
            startY = (e.clientY - rect.top) * scaleY;
            isDrawing = true;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            endX = (e.clientX - rect.left) * scaleX;
            endY = (e.clientY - rect.top) * scaleY;

            ctx.clearRect(0, 0, 512, 512);
            ctx.drawImage(img, 0, 0, 512, 512);
            ctx.strokeStyle = 'red';
            ctx.lineWidth = 3;
            ctx.strokeRect(startX, startY, endX - startX, endY - startY);
        });

        canvas.addEventListener('mouseup', (e) => {
            isDrawing = false;
            const x1 = Math.min(startX, endX);
            const y1 = Math.min(startY, endY);
            const w = Math.abs(endX - startX);
            const h = Math.abs(endY - startY);

            const cx = (x1 + w / 2) / 512;
            const cy = (y1 + h / 2) / 512;
            const normW = w / 512;
            const normH = h / 512;

            lastYoloText = `0 ${cx.toFixed(4)} ${cy.toFixed(4)} ${normW.toFixed(4)} ${normH.toFixed(4)}`;
            output.innerText = lastYoloText;
            downloadBtn.style.display = 'inline-block';
        });

        downloadBtn.addEventListener('click', () => {
            const blob = new Blob([lastYoloText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `${imageName}.lbl`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
