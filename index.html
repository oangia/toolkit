<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Ear Trainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col lg:flex-row select-none">

    <!-- SIDEBAR FOR OPTIONS -->
    <aside class="w-full lg:w-80 bg-slate-800/60 backdrop-blur border-b lg:border-b-0 lg:border-r border-slate-700/60 p-6 flex flex-col gap-6">
        <div>
            <h1 class="text-xl font-bold tracking-tight text-white mb-1">🎹 Piano Ear Trainer</h1>
            <p class="text-xs text-slate-400">Settings save automatically</p>
        </div>

        <hr class="border-slate-700">

        <!-- Option 1: Speed / Wait Duration -->
        <div class="flex flex-col gap-2">
            <label for="speed-range" class="text-sm font-semibold flex justify-between">
                <span>Reaction Speed</span>
                <span id="speed-label" class="text-blue-400 font-bold">800 ms</span>
            </label>
            <input id="speed-range" type="range" min="300" max="2000" step="50" value="800" 
                   class="w-full accent-blue-500 cursor-pointer">
            <span class="text-[11px] text-slate-400">Time given to guess the note before reveal.</span>
        </div>

        <hr class="border-slate-700">

        <!-- Option 2: Note Selection -->
        <div class="flex flex-col gap-3">
            <span class="text-sm font-semibold flex justify-between items-center">
                <span>Active Notes</span>
                <button id="select-all-btn" class="text-xs text-blue-400 hover:underline">Toggle All</button>
            </span>
            <div id="notes-checkbox-container" class="grid grid-cols-2 gap-2">
                <!-- Checkboxes generated dynamically -->
            </div>
            <span id="note-error-msg" class="text-xs text-rose-400 hidden">Please select at least one note!</span>
        </div>
    </aside>

    <!-- MAIN GAME AREA -->
    <main class="flex-1 flex flex-col items-center justify-center p-6 relative">
        <div class="flex flex-col items-center gap-8">
            <div id="circle-container" class="relative w-64 h-64 flex items-center justify-center cursor-pointer group">
                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="44" class="stroke-slate-800" stroke-width="5" fill="transparent" />
                    <circle id="timer-ring" cx="50" cy="50" r="44" class="stroke-blue-500 transition-all duration-75" stroke-width="5" stroke-dasharray="276.46" stroke-dashoffset="276.46" stroke-linecap="round" fill="transparent" />
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                    <span id="center-display" class="text-6xl font-black tracking-tight text-white group-hover:scale-105 transition-transform">▶</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Load audio file properly -->
    <script src="audio.js"></script>
    <script>
        const ALL_NOTES = [
            { note: 'C4', freq: 261.63, name: 'C' },
            { note: 'D4', freq: 293.66, name: 'D' },
            { note: 'E4', freq: 329.63, name: 'E' },
            { note: 'F4', freq: 349.23, name: 'F' },
            { note: 'G4', freq: 392.00, name: 'G' },
            { note: 'A4', freq: 440.00, name: 'A' },
            { note: 'B4', freq: 493.88, name: 'B' },
            { note: 'C5', freq: 523.25, name: 'C' }
        ];

        // --- COOKIE HELPER FUNCTIONS ---
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            let expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + encodeURIComponent(value) + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            let nameEQ = name + "=";
            let ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return decodeURIComponent(c.substring(nameEQ.length, c.length));
            }
            return null;
        }

        // --- LOAD INITIAL SETTINGS FROM COOKIES ---
        const savedSpeed = getCookie('earTrainerSpeed');
        let guessDuration = savedSpeed ? parseInt(savedSpeed) : 800;

        let savedNoteIndices = getCookie('earTrainerNotes');
        let defaultIndices = savedNoteIndices ? JSON.parse(savedNoteIndices) : ALL_NOTES.map((_, i) => i);
        
        let activeNotes = defaultIndices.map(i => ALL_NOTES[i]);

        let audioCtx = null;
        let isPlaying = false;
        let currentTimeout = null;
        let animationFrameId = null;

        const circleContainer = document.getElementById('circle-container');
        const timerRing = document.getElementById('timer-ring');
        const centerDisplay = document.getElementById('center-display');
        const speedRange = document.getElementById('speed-range');
        const speedLabel = document.getElementById('speed-label');
        const notesContainer = document.getElementById('notes-checkbox-container');
        const selectAllBtn = document.getElementById('select-all-btn');
        const noteErrorMsg = document.getElementById('note-error-msg');

        const circumference = 2 * Math.PI * 44;

        // Set initial slider UI state from loaded cookie
        speedRange.value = guessDuration;
        speedLabel.textContent = guessDuration + " ms";

        // --- RENDER CHECKBOXES DYNAMICALLY ---
        function initNoteCheckboxes() {
            notesContainer.innerHTML = '';
            ALL_NOTES.forEach((item, index) => {
                const label = document.createElement('label');
                label.className = "flex items-center gap-2.5 bg-slate-900/40 p-2.5 rounded-lg border border-slate-700/50 cursor-pointer hover:border-slate-600 transition-colors";
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.value = index;
                checkbox.checked = defaultIndices.includes(index);
                checkbox.className = "w-4 h-4 rounded accent-blue-500 bg-slate-900 border-slate-700";
                
                checkbox.addEventListener('change', updateActiveNotes);

                const span = document.createElement('span');
                span.className = "text-sm font-medium text-slate-200";
                span.textContent = `${item.name} (${item.note})`;

                label.appendChild(checkbox);
                label.appendChild(span);
                notesContainer.appendChild(label);
            });
        }

        function updateActiveNotes() {
            const checkboxes = notesContainer.querySelectorAll('input[type="checkbox"]');
            activeNotes = [];
            const selectedIndices = [];

            checkboxes.forEach((cb) => {
                if (cb.checked) {
                    const idx = parseInt(cb.value);
                    activeNotes.push(ALL_NOTES[idx]);
                    selectedIndices.push(idx);
                }
            });

            // Save selected note indices to cookie
            setCookie('earTrainerNotes', JSON.stringify(selectedIndices));

            if (activeNotes.length === 0) {
                noteErrorMsg.classList.remove('hidden');
                if (isPlaying) stopLoop();
            } else {
                noteErrorMsg.classList.add('hidden');
            }
        }

        // Speed slider listener
        speedRange.addEventListener('input', (e) => {
            guessDuration = parseInt(e.target.value);
            speedLabel.textContent = guessDuration + " ms";
            // Save speed to cookie
            setCookie('earTrainerSpeed', guessDuration);
        });

        // Toggle All button
        selectAllBtn.addEventListener('click', () => {
            const checkboxes = notesContainer.querySelectorAll('input[type="checkbox"]');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => cb.checked = !allChecked);
            updateActiveNotes();
        });

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playPianoTone(freq, duration = 3.5) {
            const ctx = getAudioContext();
            const now = ctx.currentTime;

            const masterGain = ctx.createGain();
            masterGain.connect(ctx.destination);

            masterGain.gain.setValueAtTime(0, now);
            masterGain.gain.linearRampToValueAtTime(0.7, now + 0.015);
            masterGain.gain.exponentialRampToValueAtTime(0.3, now + 0.6);
            masterGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

            const harmonics = [
                { mult: 1.0, gain: 1.0, type: 'triangle' },
                { mult: 2.0, gain: 0.4, type: 'sine' },
                { mult: 3.0, gain: 0.2, type: 'sine' },
                { mult: 4.0, gain: 0.08, type: 'sine' }
            ];

            harmonics.forEach(h => {
                const osc = ctx.createOscillator();
                const oscGain = ctx.createGain();

                osc.type = h.type;
                osc.frequency.setValueAtTime(freq * h.mult, now);
                oscGain.gain.setValueAtTime(h.gain, now);

                osc.connect(oscGain);
                oscGain.connect(masterGain);

                osc.start(now);
                osc.stop(now + duration + 0.05);
            });
        }

        function playBase64Audio(letter) {
            if (typeof AUDIO_BASE64_MAP === 'undefined') return;
            const base64Uri = AUDIO_BASE64_MAP[letter];
            if (!base64Uri) return;
            const audio = new Audio(base64Uri);
            audio.play().catch(err => console.error(err));
        }

        function toggleSession() {
            if (activeNotes.length === 0) {
                noteErrorMsg.classList.remove('hidden');
                return;
            }
            if (isPlaying) {
                stopLoop();
            } else {
                startLoop();
            }
        }

        function startLoop() {
            isPlaying = true;

            centerDisplay.textContent = activeNotes[0].name;
            centerDisplay.className = "text-6xl font-black tracking-tight text-blue-400";
            timerRing.style.stroke = "#3b82f6";
            timerRing.style.strokeDashoffset = "0";

            playPianoTone(activeNotes[0].freq, 1.5);

            currentTimeout = setTimeout(() => {
                if (!isPlaying) return;
                runRandomStep();
            }, 2000);
        }

        function runRandomStep() {
            if (!isPlaying || activeNotes.length === 0) return;

            const randomIndex = Math.floor(Math.random() * activeNotes.length);
            const currentItem = activeNotes[randomIndex];

            playPianoTone(currentItem.freq, 2.5);
            
            centerDisplay.textContent = "?";
            centerDisplay.className = "text-6xl font-black tracking-tight text-amber-400 animate-pulse";
            timerRing.style.stroke = "#f59e0b";

            const startTime = performance.now();

            function updateTimer(timestamp) {
                if (!isPlaying) return;
                const elapsed = timestamp - startTime;
                const progress = elapsed / guessDuration;

                timerRing.style.strokeDashoffset = circumference * Math.min(progress, 1);

                if (elapsed < guessDuration) {
                    animationFrameId = requestAnimationFrame(updateTimer);
                } else {
                    //playBase64Audio(currentItem.name);

                    centerDisplay.textContent = currentItem.name;
                    centerDisplay.className = "text-6xl font-black tracking-tight text-emerald-400";
                    timerRing.style.stroke = "#10b981";
                    timerRing.style.strokeDashoffset = "0";

                    currentTimeout = setTimeout(() => {
                        if (!isPlaying) return;
                        runRandomStep();
                    }, 800);
                }
            }

            animationFrameId = requestAnimationFrame(updateTimer);
        }

        function stopLoop() {
            isPlaying = false;
            if (currentTimeout) clearTimeout(currentTimeout);
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            centerDisplay.textContent = "▶";
            centerDisplay.className = "text-6xl font-black tracking-tight text-white group-hover:scale-105 transition-transform";
            timerRing.style.stroke = "#3b82f6";
            timerRing.style.strokeDashoffset = circumference;
        }

        // Initialize UI and load selections
        initNoteCheckboxes();
        circleContainer.addEventListener('click', toggleSession);
    </script>
</body>
</html>
